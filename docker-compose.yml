services:
  web:
    build: .
    ports:
      - "8888:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env


    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: afrochick
      DB_USER: afrochick
      DB_PASS: afrochick_secret
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: afrochick
      MYSQL_USER: afrochick
      MYSQL_PASSWORD: afrochick_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uafrochick", "-pafrochick_secret"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped


  # Afrochick database UI — NOT the fellow-saas phpMyAdmin on :8081
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
      PMA_USER: afrochick
      PMA_PASSWORD: afrochick_secret
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


volumes:
  db_data:
